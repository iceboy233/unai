[workspace]
resolver = "2"

[package]
name = "unai"
edition = "2021"

[dependencies]
async-openai = { version = "0.41", features = ["chat-completion"] }
bpaf = { version = "0.9", features = ["bpaf_derive"] }
frankenstein = { version = "0.50", features = ["client-reqwest"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_fmt = "1"
simple_logger = "5"
telegram-markdown-v2 = "0.2"
tokio = { version = "1", features = ["macros", "rt"] }
toml = { version = "1" }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
