[workspace]
resolver = "2"

[package]
name = "unai"
edition = "2021"

[dependencies]
frankenstein = { version = "0.50", features = ["client-reqwest"] }
log = "0.4"
serde_fmt = "1"
simple_logger = "5"
telegram-markdown-v2 = "0.2"
tokio = { version = "1", features = ["macros", "rt"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
